
# --------------------------------------------------
# HTTP: redirect all traffic to HTTPS
# --------------------------------------------------

server {
    listen 80;
    server_name avatar.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}


# --------------------------------------------------
# HTTPS: public application entry point
# --------------------------------------------------

server {
    listen 443 ssl;
    http2 on;

    # TODO: Mount the certificate and private key at certs/origin.pem and certs/origin-key.pem.
    # Replace avatar.example.com with actual domain.
    server_name avatar.example.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # --------------------------------------------------
    # API -> Django
    # --------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }


    # --------------------------------------------------
    # Django admin
    # --------------------------------------------------

    location /admin/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------
    # Django static files
    # --------------------------------------------------

    location /static/ {
        alias /usr/share/nginx/html/static/;

        access_log off;
        expires 1y;

        add_header Cache-Control "public";
    }


    # --------------------------------------------------
    # Public avatar endpoint -> Varnish -> Django
    # --------------------------------------------------

    location /avatar/ {
        proxy_pass http://varnish:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }


    # --------------------------------------------------
    # React frontend
    # --------------------------------------------------

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

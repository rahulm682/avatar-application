services:

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - pg_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # --------------------------------------------------
  # Silo: local S3-compatible storage
  # --------------------------------------------------

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    
    env_file:
      - .env

    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?Set SILO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Set SILO_ROOT_PASSWORD in .env}

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    volumes:
      - silo_data:/data
      - ./scripts:/scripts:ro

    ports:
      # Browser uploads directly to this endpoint.
      - "127.0.0.1:9000:9000"

      # Local Silo administration console.
      - "127.0.0.1:9001:9001"


  # --------------------------------------------------
  # Initialize Silo bucket and configuration
  # --------------------------------------------------

  silo-init:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: avatar-backend:dev
    restart: "no"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SILO_ROOT_USER: ${SILO_ROOT_USER:?Set SILO_ROOT_USER in .env}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Set SILO_ROOT_PASSWORD in .env}

    volumes:
      - ./scripts:/scripts:ro

    command:
      - python
      - /scripts/init_s3.py

    depends_on:
      - silo


  # --------------------------------------------------
  # Prepare Django static-files volume
  # --------------------------------------------------

  static-init:
    image: avatar-backend:dev
    restart: "no"

    user: root

    volumes:
      - static_data:/app/staticfiles

    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/staticfiles
        chown -R django:django /app/staticfiles

    depends_on:
      silo-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Django / Gunicorn
  # --------------------------------------------------

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: avatar-backend:dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

    command:
      - /bin/sh
      - -c
      - |
        python manage.py collectstatic --noinput

        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --reload \
          --access-logfile - \
          --error-logfile - \
          --graceful-timeout 30 \
          --timeout 60

    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

      silo-init:
        condition: service_completed_successfully

      static-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Periodic Django maintenance jobs
  # --------------------------------------------------

  scheduler:
    image: avatar-backend:dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

    volumes:
      - ./backend:/app

    command:
      - /bin/sh
      - -c
      - |
        set -e
        while true; do
          echo "Running scheduled Django maintenance..."

          python manage.py cleanup_unverified
          python manage.py flushexpiredtokens
          python manage.py purge_deleted

          echo "Maintenance complete. Sleeping for one hour."
          sleep 3600
        done

    depends_on:
      db:
        condition: service_healthy

      silo-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Varnish: avatar caching
  # --------------------------------------------------

  varnish:
    image: varnish:9.1.0
    restart: unless-stopped

    environment:
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?Set ORIGIN_VERIFY_SECRET in .env}
      VARNISH_SIZE: ${VARNISH_SIZE:-64m}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        sed "s/__ORIGIN_VERIFY_SECRET__/$$ORIGIN_VERIFY_SECRET/g" \
          /etc/varnish/default.vcl.template \
          > /tmp/default.vcl

        exec varnishd \
          -F \
          -f /tmp/default.vcl \
          -a http=:80,HTTP \
          -s malloc,$$VARNISH_SIZE

    volumes:
      - ./cdn/default.vcl:/etc/varnish/default.vcl.template:ro

    expose:
      - "80"

    depends_on:
      - backend


  # --------------------------------------------------
  # React / Vite development server
  # --------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    image: avatar-frontend:dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      VITE_API_URL: ""
      VITE_AVATAR_BASE_URL: ""

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    expose:
      - "5173"


  # --------------------------------------------------
  # Main Nginx entry point
  # --------------------------------------------------

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/html/static:ro

    depends_on:
      - frontend
      - backend
      - varnish


  # --------------------------------------------------
  # Mailpit: development email testing
  # --------------------------------------------------

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:8025:8025"


volumes:
  pg_data:
  silo_data:
  static_data:
  frontend_node_modules:
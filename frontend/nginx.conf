server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router support:
    # If a requested file does not exist, serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite-generated assets have content hashes in their filenames.
    # They can safely be cached for a long time.
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the application entry point.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}


services:

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}

    volumes:
      - pg_data:/var/lib/postgresql/data

    # Intentionally no published ports.
    # Only containers on the Docker network can access PostgreSQL.

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  # --------------------------------------------------
  # Prepare static-files volume permissions
  # --------------------------------------------------

  static-init:
    image: avatar-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: "no"
    user: root

    volumes:
      - static_data:/app/staticfiles

    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/staticfiles
        chown -R django:django /app/staticfiles


  # --------------------------------------------------
  # One-time Django initialization
  # --------------------------------------------------

  backend-init:
    image: avatar-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: "no"

    env_file:
      - .env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    volumes:
      - static_data:/app/staticfiles

    command:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Running database migrations..."
        python manage.py migrate --noinput

        echo "Collecting static files..."
        python manage.py collectstatic --noinput

        echo "Django initialization completed."

    depends_on:
      db:
        condition: service_healthy

      static-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Django / Gunicorn
  # --------------------------------------------------

  backend:
    image: avatar-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    volumes:
      - static_data:/app/staticfiles:ro

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

      backend-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Periodic Django maintenance jobs
  # --------------------------------------------------

  scheduler:
    image: avatar-backend:prod
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    command:
      - /bin/sh
      - -c
      - |
        set -e

        while true; do
          echo "Running scheduled Django maintenance..."

          python manage.py cleanup_unverified
          python manage.py flushexpiredtokens
          python manage.py purge_deleted

          echo "Maintenance complete. Sleeping for one hour."
          sleep 3600
        done

    depends_on:
      db:
        condition: service_healthy

      backend-init:
        condition: service_completed_successfully


  # --------------------------------------------------
  # Varnish: avatar caching
  # --------------------------------------------------

  varnish:
    image: varnish:9.1.0
    restart: unless-stopped

    environment:
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?Set ORIGIN_VERIFY_SECRET in .env.prod}
      VARNISH_SIZE: ${VARNISH_SIZE:-128m}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        sed "s/__ORIGIN_VERIFY_SECRET__/$$ORIGIN_VERIFY_SECRET/g" \
          /etc/varnish/default.vcl.template \
          > /tmp/default.vcl

        exec varnishd \
          -F \
          -f /tmp/default.vcl \
          -a http=:80,HTTP \
          -s malloc,$$VARNISH_SIZE

    volumes:
      - ./cdn/default.vcl:/etc/varnish/default.vcl.template:ro

    expose:
      - "80"

    depends_on:
      - backend


  # --------------------------------------------------
  # React production frontend
  # --------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production

      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_AVATAR_BASE_URL: ${VITE_AVATAR_BASE_URL:-}

    image: avatar-frontend:prod
    restart: unless-stopped

    expose:
      - "80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s


  # --------------------------------------------------
  # Main public Nginx entry point
  # --------------------------------------------------

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

      # Cloudflare Origin certificate and private key.
      - ./certs:/etc/nginx/certs:ro

      # Django collectstatic output.
      - static_data:/usr/share/nginx/html/static:ro

    depends_on:
      - frontend
      - backend
      - varnish


volumes:
  pg_data:
  static_data:

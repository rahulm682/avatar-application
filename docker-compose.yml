name: avatar-service

# Environment shared by the backend container. Root credentials of Silo are deliberately NOT passed here.
x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env first}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  POSTGRES_DB: ${POSTGRES_DB:-avatar}
  POSTGRES_USER: ${POSTGRES_USER:-avatar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar-dev-password}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-avatars-dev}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://silo:9000}
  AWS_S3_PUBLIC_ENDPOINT_URL: ${AWS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-path}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
  AVATAR_BASE_URL: ${AVATAR_BASE_URL:-http://localhost:8080}
  INVALIDATION_BACKEND: ${INVALIDATION_BACKEND:-varnish}
  VARNISH_BAN_URL: ${VARNISH_BAN_URL:-http://varnish:80}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
  TZ: Asia/Kolkata

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar-dev-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avatar} -d ${POSTGRES_DB:-avatar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:-silo-admin}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-silo-admin-secret-change-me}
      # Used by scripts/create_app_key.sh (run inside this container)
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-avatars-dev}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - silo_data:/data
      - ./scripts:/scripts:ro
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  # One-shot job: creates the bucket, CORS rule and lifecycle rule (idempotent).
  # It is also used to run the smoke test:  docker compose run --rm silo-init python /scripts/smoke_test.py
  silo-init:
    build: ./backend
    image: avatar-backend:dev
    command: python /scripts/init_s3.py
    environment:
      <<: *backend-env
      SILO_ROOT_USER: ${SILO_ROOT_USER:-silo-admin}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:-silo-admin-secret-change-me}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - silo
    restart: "no"

  backend:
    build: ./backend
    image: avatar-backend:dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Housekeeping, once an hour: removes sign-ups that were never verified, expired refresh-token records, and
  # soft-deleted pictures and accounts that are older than the retention period (30 days).
  # (A hosted setup would use the platform's scheduler or cron to run the same commands.)
  scheduler:
    build: ./backend
    image: avatar-backend:dev
    command: >-
      sh -c "while true; do
      python manage.py cleanup_unverified;
      python manage.py flushexpiredtokens;
      python manage.py purge_deleted;
      sleep 3600;
      done"
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Local CDN. The VCL file contains a placeholder for the origin secret, which is substituted at start-up.
  varnish:
    image: varnish:9.1.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__ORIGIN_VERIFY_SECRET__|$$ORIGIN_VERIFY_SECRET|g" /vcl/default.vcl > /tmp/default.vcl &&
        exec varnishd -F -f /tmp/default.vcl -a http=:80,HTTP -s malloc,$$VARNISH_SIZE
    environment:
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
      VARNISH_SIZE: ${VARNISH_SIZE:-64m}
    volumes:
      - ./cdn/default.vcl:/vcl/default.vcl:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_AVATAR_BASE_URL: ${VITE_AVATAR_BASE_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  pg_data:
  silo_data: